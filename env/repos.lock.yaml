## 3. 特征提取配置 / Feature-extraction configuration

必须与权重一起锁定，否则"同一编码器"这句话没有意义。

```yaml
encoder_id: "wide_resnet50_2:IMAGENET1K_V1:layer2+layer3"
preprocessing_id: "resize256-center224-ps3-st1-norm0.485-0.456-0.406_0.229-0.224-0.225"
image_size: 224
resize: 256
patch_size: 3
patch_stride: 1
normalise_mean: [0.485, 0.456, 0.406]
normalise_std:  [0.229, 0.224, 0.225]
observed_feature_shape: [676, 1536]   # 26x26 patches, layer2(512)+layer3(1024)
```

**与官方仓库的关系 / Relation to the official repo.** 这组设置取自
`third_party/patchcore-inspection/README.md` 与 `sample_training.sh` 的文档化命令
(`-b wideresnet50 -le layer2 -le layer3 --patchsize 3 --resize 256 --imagesize 224`)。

**明确不是复现 / Explicitly not a reproduction.** 本项目实现的**分数**是
Part A6 指定的 "PatchCore-style max-distance detector"：欧氏最近距离 + 逐 patch 取
最大。这**不是**原论文的加权 PatchCore 分数，也**不是**官方仓库实际实现的分数。
两个独立的差异必须都记住：

1. 论文 Eq. 7 的 reweighting 项：`s = (1 − exp(d*)/Σ_{m∈N_b(m*)} exp(d(m))) · s*`，
   其中 `N_b(m*)` 是**参考侧匹配点 m\*** 的 b 个近邻，而非测试 patch 的近邻。
2. 官方仓库**根本没有实现 Eq. 7**。`NearestNeighbourScorer.predict` 是
   `np.mean(query_distances, axis=-1)`，`PatchMaker.score` 是 `torch.max`。
   已在 `fcaa92f` 的 `src/patchcore/` 中确认无 reweighting 代码。

因此"复现 PatchCore"与"实现 max-score 参考检测器"是本项目里两件不同的事，
输出必须分开命名。Phase 2 的门槛报告需要明确这一点。

